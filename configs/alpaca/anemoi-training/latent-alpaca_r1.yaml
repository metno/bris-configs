# A model with 4 latent grid fields that are initialized to 0 and do not contribute to the loss
# This allows the model to use these as memory fields when doing roll out
defaults:
  - basic-alpaca
  - _self_

# Repeat this whole block because we need to override normalization for latents
data:
  datasets:
    data:
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: "mean-std"
            std:
              - tp
              - ssrd
              - tcw
              - q_50
              - q_100
              - q_150
              - q_200
              - q_250
              - q_300
              - q_400
              - q_500
              - q_700
              - q_850
              - q_925
              - q_1000
            max:
              - z
            none:
              - cos_latitude
              - cos_longitude
              - sin_latitude
              - sin_longitude
              - cos_julian_day
              - cos_local_time
              - sin_julian_day
              - sin_local_time
              - insolation
              - lsm
              - lcc
              - mcc
              - hcc
              - tcc
              # Don't normalize latents, since mean and std is 0
              - latent0
              - latent1
              - latent2
              - latent3

dataloader:
  dataset:
    join:
      - dataset: ${system.input.dataset}
      - dataset: ${system.input.dataset_land}
        # Add latent fields initialized to 0
      - synthetic:
          geography:
            named: "O96"
          dates:
            start: "1979-01-01"
            end: "2025-01-31"
            frequency: "6h"
          variables:
            - name: "latent0"
              values:
                constant: 0
            - name: "latent1"
              values:
                constant: 0
            - name: "latent2"
              values:
                constant: 0
            - name: "latent3"
              values:
                constant: 0
          layout: "gridded"
    adjust: ["start", "end"]
    reorder: sort
  select: ['10u', '10v', '2d', '2t', 'cos_julian_day', 'cos_latitude', 'cos_local_time', 'cos_longitude', 'hcc', 'insolation', 'latent0', 'latent1', 'latent2', 'latent3', 'lcc', 'lsm', 'mcc', 'msl', 'q_100', 'q_1000', 'q_150', 'q_200', 'q_250', 'q_300', 'q_400', 'q_50', 'q_500', 'q_700', 'q_850', 'q_925', 'sin_julian_day', 'sin_latitude', 'sin_local_time', 'sin_longitude', 'skt', 'sp', 'ssrd', 'strd', 't_100', 't_1000', 't_150', 't_200', 't_250', 't_300', 't_400', 't_50', 't_500', 't_700', 't_850', 't_925', 'tcc', 'tcw', 'tp', 'u_100', 'u_1000', 'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_50', 'u_500', 'u_700', 'u_850', 'u_925', 'v_100', 'v_1000', 'v_150', 'v_200', 'v_250', 'v_300', 'v_400', 'v_50', 'v_500', 'v_700', 'v_850', 'v_925', 'w_100', 'w_1000', 'w_150', 'w_200', 'w_250', 'w_300', 'w_400', 'w_50', 'w_500', 'w_700', 'w_850', 'w_925', 'z', 'z_100', 'z_1000', 'z_150', 'z_200', 'z_250', 'z_300', 'z_400', 'z_50', 'z_500', 'z_700', 'z_850', 'z_925']

training:
  scalars:
    datasets:
      data:
        general_variable:
          _target_: anemoi.training.losses.scalers.GeneralVariableLossScaler
          weights:
            default: 1
            q: 0.6 #1
            t: 6   #1
            u: 0.8 #0.5
            v: 0.5 #0.33
            w: 0.001
            z: 12  #1
            sp: 10
            10u: 0.1
            10v: 0.1
            2d: 0.5
            tp: 0.025
            cp: 0.0025
            # Don't put any weight on latents in the loss
            latent0: 0
            latent1: 0
            latent2: 0
            latent3: 0

diagnostics:
  log:
    mlflow:
      run_name: latent-alpaca_r1
