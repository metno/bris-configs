# ============================================================================
# lonely-lama.yaml — shared stretched grid ensemble pre-training base (metno).
# anemoi-core @ release training-0.16.0 (c3c7a893f), torch-2.8 env
# (see setup_env_torch28_shared.sh in this folder).
#
# Run with the config PATH (not --config-dir, which has lowest priority):
#   anemoi-training train --config-path=<this folder> --config-name=lonely-lama
#
# Fill in every TODO before running.
# ============================================================================
defaults:
  - data: zarr
  - dataloader: native_grid
  - diagnostics: evaluation_ens
  - system: slurm
  - graph: stretched_grid
  - model: graphtransformer_ens
  - task: forecaster
  - training: stretched_grid_meps
  - _self_

config_validation: False

data:
  frequency: 6h
  datasets:
    data:
      forcing:
        - cos_latitude
        - cos_longitude
        - sin_latitude
        - sin_longitude
        - cos_julian_day
        - cos_local_time
        - sin_julian_day
        - sin_local_time
        - insolation
        - lsm
        - z
      diagnostic:
        - tp
        - ssrd
        - strd
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: "mean-std"
            std:
              - tp
              - ssrd
              - tcw
              - q_50
              - q_100
              - q_150
              - q_200
              - q_250
              - q_300
              - q_400
              - q_500
              - q_700
              - q_850
              - q_925
              - q_1000
            max:
              - z
            none:
              - cos_latitude
              - cos_longitude
              - sin_latitude
              - sin_longitude
              - cos_julian_day
              - cos_local_time
              - sin_julian_day
              - sin_local_time
              - insolation
              - lsm
              - lcc
              - mcc
              - hcc
              - tcc

dataloader:
  num_workers:
    training: 4
    validation: 4
    test: 4
  batch_size:
    training: 1
    validation: 1
    test: 1
  prefetch_factor: 2
  limit_batches:
    training: null
    validation: 50
    test: 20
  dataset:
    cutout:
    - dataset: ${system.input.dataset}
      trim_edge: 50
      reorder: sort
    - dataset: ${system.input.dataset_global}
      reorder: sort
    adjust: all
    min_distance_km: 0.0

  select: ['10u', '10v', '2d', '2t', 'cos_julian_day', 'cos_latitude', 'cos_local_time', 'cos_longitude', 'hcc', 'insolation', 'lcc', 'lsm', 'mcc', 'msl', 'q_100', 'q_1000', 'q_150', 'q_200', 'q_250', 'q_300', 'q_400', 'q_50', 'q_500', 'q_700', 'q_850', 'q_925', 'sin_julian_day', 'sin_latitude', 'sin_local_time', 'sin_longitude', 'skt', 'sp', 'ssrd', 'strd', 't_100', 't_1000', 't_150', 't_200', 't_250', 't_300', 't_400', 't_50', 't_500', 't_700', 't_850', 't_925', 'tcc', 'tcw', 'tp', 'u_100', 'u_1000', 'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_50', 'u_500', 'u_700', 'u_850', 'u_925', 'v_100', 'v_1000', 'v_150', 'v_200', 'v_250', 'v_300', 'v_400', 'v_50', 'v_500', 'v_700', 'v_850', 'v_925', 'w_100', 'w_1000', 'w_150', 'w_200', 'w_250', 'w_300', 'w_400', 'w_50', 'w_500', 'w_700', 'w_850', 'w_925', 'z', 'z_100', 'z_1000', 'z_150', 'z_200', 'z_250', 'z_300', 'z_400', 'z_50', 'z_500', 'z_700', 'z_850', 'z_925']
  training:
    datasets:
      data:
        dataset_config:
          dataset: ${dataloader.dataset}
          frequency: ${data.frequency}
          select: ${dataloader.select}
          reorder: sort
        start: 2020-02-01
        end: 2024-04-30
  validation:
    datasets:
      data:
        dataset_config:
          dataset: ${dataloader.dataset}
          frequency: ${data.frequency}
          select: ${dataloader.select}
          reorder: sort
        start: 2024-05-01
        end: 2025-04-30
  test:
    datasets:
      data:
        dataset_config:
          dataset: ${dataloader.dataset}
          frequency: ${data.frequency}
          select: ${dataloader.select}
          reorder: sort
        start: 2024-05-01
        end: 2025-04-30

system:
  hardware:
    num_gpus_per_model: 2
    num_gpus_per_ensemble: 4
  input:
    dataset: /leonardo_work/AIFAC_5C0_154/weathergen/data/aifs-meps-2.5km-2020-2025-6h-v7.zarr
    dataset_global: /leonardo_work/AIFAC_5C0_154/weathergen/data/aifs-od-an-oper-0001-mars-n320-2016-2025-6h-v1-for-single-v2.zarr
    graph: TODO  # e.g. <your area>/graphs/o96_tri5_knn12.pt — built on first run (graph.overwrite False)
  output:
    root: TODO

graph:
  overwrite: False
  nodes:
    hidden:
      node_builder:
        lam_resolution: 10
        global_resolution: 7

model:
  num_channels: 1024
  keep_batch_sharded: True
  trainable_parameters:
    data: 0
    hidden: 0
    data2hidden: 0
    hidden2data: 0
    hidden2hidden: 0
  processor:
    num_chunks: 4
  encoder:
    num_chunks: 1
  decoder:
    num_chunks: 2
  # Block-level torch.compile: +45% samples/s/node. REQUIRES the torch-2.8 env; do NOT set
  # PYTORCH_CUDA_ALLOC_CONF=expandable_segments; do NOT add a CRPS/loss compile entry
  # (crashes validation via CUDA-graph output reuse).
  compile:
    - module: anemoi.models.layers.block.GraphTransformerProcessorBlock
    - module: anemoi.models.layers.block.GraphTransformerMapperBlock
    - module: anemoi.models.layers.normalization.ConditionalLayerNorm
  bounding:
    - _target_: anemoi.models.layers.bounding.ReluBounding
      variables:
        - tp
        - ssrd
        - tcw
        - q_50
        - q_100
        - q_150
        - q_200
        - q_250
        - q_300
        - q_400
        - q_500
        - q_700
        - q_850
        - q_925
        - q_1000
    - _target_: anemoi.models.layers.bounding.HardtanhBounding
      variables:
        - tcc
      min_val: 0
      max_val: 1
    - _target_: anemoi.models.layers.bounding.FractionBounding
      variables:
        - lcc
        - mcc
        - hcc
      min_val: 0
      max_val: 1
      total_var: tcc

task:
  multistep_input: 2
  multistep_output: 1
  timestep: "6H"
  rollout:
    start: 1
    epoch_increment: 0
    maximum: 1
  validation_rollout: 1

training:
  # bf16 gradient-compression DDP hook: halves the inter-node allreduce volume (~1 GB fp32/step
  # at 246.5M params); +30% at 8 nodes, no measurable loss-trajectory impact. Remove this block
  # (and consider config_validation: True) if you prefer fp32 gradient reduction.
  #strategy: #TODO: Test this
  #  ddp_comm_hook:
  #    _target_: hydra.utils.get_method
  #    path: torch.distributed.algorithms.ddp_comm_hooks.default_hooks.bf16_compress_hook
  run_id: null     # null for a fresh run; an existing run id to resume it
  fork_run_id: 494bc270806d46a795e7ff3770ff660a # basic-alpaca
  load_weights_only: True
  transfer_learning: True
  check_variables_compatibility:
    ignore_units: True
    ignore_processing_period: True

  max_epochs: null
  max_steps: 10000
  ensemble_size_per_device: 1
  optimization:
    # LR NOTE: anemoi multiplies this by the number of DDP instances (total_gpus / gpus_per_model),
    # NOT by batch size. 4 nodes x bs2: 16 x 1.25e-4 = 2.0e-3 effective. If you run 8 nodes x bs1
    # (same effective batch 16), use 6.25e-5 to keep the same effective LR.
    lr: 6.6e-6
    lr_scheduler:
      lr_min: 3.0e-7
      warmup_t: 500

  metrics:
    datasets:
      data:
        - z_500
        - z_1000
        - t_850 
        - t_500
        - u_850
        - v_850
        - q_700
        - 2t
        - 2d
        - 10u
        - 10v
        - msl
        - sp
        - tp
        - tcw
        - tcc
        - ssrd

diagnostics:
  plot:
    callbacks: []
  log:
    interval: 100
    mlflow:
      enabled: True
      offline: True          # compute nodes have no internet; sync from a login node
      authentication: True
      tracking_uri: https://mlflow.ecmwf.int
      experiment_name: metno
      run_name: TODO
      system: True
  # Checkpoints: step-aligned every 10k (all kept) for equal-progress comparisons across runs;
  # every epoch (the latest 3 kept); rolling hourly resume checkpoint (<= 1 h lost on a walltime kill).
  checkpoint:
    every_n_minutes:
      save_frequency: 60
      num_models_saved: 1
    every_n_epochs:
      save_frequency: 1
      num_models_saved: 3
    every_n_train_steps:
      save_frequency: 10000
      num_models_saved: -1
