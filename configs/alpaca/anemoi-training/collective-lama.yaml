diagnostics:
  plot:
    callbacks: []
  log:
    interval: 100
    mlflow:
      enabled: True
      offline: True          # compute nodes have no internet; sync from a login node
      authentication: True
      tracking_uri: https://mlflow.ecmwf.int
      experiment_name: metno
      run_name: collective-lama
      system: True
  # Checkpoints: step-aligned every 10k (all kept); every epoch (the latest 3 kept); rolling hourly resume checkpoint.
  checkpoint:
    every_n_minutes:
      save_frequency: 60
      num_models_saved: 1
    every_n_epochs:
      save_frequency: 1
      num_models_saved: 3
    every_n_train_steps:
      save_frequency: 10000
      num_models_saved: -1
